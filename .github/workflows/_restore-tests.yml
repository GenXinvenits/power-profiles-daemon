name: Restore tests
on:
  push:
    branches: [TM2017]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TM2017
          fetch-depth: 0
      - name: Restore and fix test fixture
        run: |
          git show a8380d85a8bc3ec771b933eb44a989813be25090:tests/integration_test.py > tests/integration_test.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/integration_test.py')
          s = p.read_text()
          old = '"low-power balanced balanced-performance performance\\n",'
          new = '"low-power balanced balanced_performance performance\\n",'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration_test.py .github/workflows/_restore-tests.yml
          git commit -m 'Fix platform profile test fixture'
          git push origin TM2017
          git rm .github/workflows/_restore-tests.yml
          git commit -m 'Remove temporary test restore workflow'
          git push origin TM2017
