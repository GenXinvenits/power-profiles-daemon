name: TM2017 fix

on:
  push:
    branches: [TM2017]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: TM2017
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/ppd-driver-platform-profile.c')
          s = p.read_text()
          old = '''  g_object_set (object,\n                "driver-name", "platform_profile",\n                "profiles", PPD_PROFILE_PERFORMANCE | PPD_PROFILE_BALANCED_PERFORMANCE | PPD_PROFILE_BALANCED | PPD_PROFILE_POWER_SAVER,\n                NULL);'''
          new = '''  g_object_set (object,\n                "driver-name", "platform_profile",\n                "profiles", PPD_PROFILE_PERFORMANCE | PPD_PROFILE_BALANCED | PPD_PROFILE_POWER_SAVER,\n                NULL);'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  self->probe_result = verify_acpi_platform_profile_choices (self);\n  if (self->probe_result == PPD_PROBE_RESULT_FAIL) {'''
          new = '''  self->probe_result = verify_acpi_platform_profile_choices (self);\n  if (self->probe_result == PPD_PROBE_RESULT_SUCCESS &&\n      g_strv_contains ((const char * const*) self->profile_choices, "balanced_performance"))\n    g_object_set (G_OBJECT (self),\n                  "profiles", PPD_PROFILE_PERFORMANCE | PPD_PROFILE_BALANCED_PERFORMANCE | PPD_PROFILE_BALANCED | PPD_PROFILE_POWER_SAVER,\n                  NULL);\n  if (self->probe_result == PPD_PROBE_RESULT_FAIL) {'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/integration_test.py')
          s = p.read_text()

          # The fake driver advertises all four profiles now.
          start = s.index('    def test_fake_driver(self):')
          end = s.find('\n    def ', start + 10)
          block = s[start:end if end != -1 else len(s)]
          assert 'self.assertEqual(len(profiles), 3)' in block
          block = block.replace('self.assertEqual(len(profiles), 3)', 'self.assertEqual(len(profiles), 4)')
          s = s[:start] + block + s[end if end != -1 else len(s):]

          # Intel P-State now exposes the fourth profile.
          start = s.index('    def test_intel_pstate_passive_with_epb(self):')
          end = s.find('\n    def ', start + 10)
          block = s[start:end if end != -1 else len(s)]
          assert 'self.assertEqual(len(profiles), 3)' in block
          block = block.replace('self.assertEqual(len(profiles), 3)', 'self.assertEqual(len(profiles), 4)', 1)
          s = s[:start] + block + s[end if end != -1 else len(s):]

          # Balanced maps to balance_power on this branch.
          for name in [
              'test_intel_pstate',
              'test_intel_pstate_balance',
              'test_intel_pstate_disabled_upower',
              'test_intel_pstate_upower',
              'test_intel_pstate_reapply_on_resume_from_sleep',
          ]:
              start = s.index(f'    def {name}(self):')
              end = s.find('\n    def ', start + 10)
              block = s[start:end if end != -1 else len(s)]
              block = block.replace('"balance_performance"', '"balance_power"')
              s = s[:start] + block + s[end if end != -1 else len(s):]

          # The Xiaomi/ACPI platform value uses an underscore.
          start = s.index('    def test_quiet(self):')
          end = s.find('\n    def ', start + 10)
          block = s[start:end if end != -1 else len(s)]
          block = block.replace('b"balanced-performance"', 'b"balanced_performance"')
          s = s[:start] + block + s[end if end != -1 else len(s):]

          # AMD + platform remains a three-profile combination when the ACPI
          # platform does not advertise balanced_performance.
          start = s.index('    def test_multi_driver_flows(self):')
          end = s.find('\n    def ', start + 10)
          block = s[start:end if end != -1 else len(s)]
          block = block.replace('b"balance_performance"', 'b"balance_power"')
          s = s[:start] + block + s[end if end != -1 else len(s):]

          p.write_text(s)
          Path('.github/workflows/_tm2017-fix.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ppd-driver-platform-profile.c tests/integration_test.py .github/workflows/_tm2017-fix.yml
          git commit -m 'Fix four-profile test compatibility'
          git push origin TM2017
